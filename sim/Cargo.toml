[package]
name = "rover-sim"
version = "0.1.0"
edition = "2021"
description = "A ground rover in a textured room: dynamics, stereo camera rendering, IMU, EuRoC-format datasets and a step server"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
